    <script>
      const tl = gsap.timeline({ paused: true });
      const BARS = "#bar-top, #bar-bot";

      // 1. Letterbox reveal: black bars part from a thin strip to full frame while the camera settles
      tl.set(BARS, { scaleY: 0.94 }, 0);
      tl.to(BARS, { scaleY: 0, duration: 2.0, ease: "power3.inOut" }, 0.15);
      tl.set("#w-legs", { scale: 1.12 }, 0);
      tl.to("#w-legs", { scale: 1.0, duration: 2.6, ease: "power2.out" }, 0);

      // 2. Shoes land slightly large and settle (after 0.5 s of black)
      tl.set("#w-feet", { scale: 1.18 }, 0);
      tl.to("#w-feet", { scale: 1.04, duration: 1.2, ease: "expo.out" }, 3.1);

      // 3. Whip up into the outfit (continues the source's tilt)
      tl.set("#w-waist", { y: 700 }, 0);
      tl.to("#w-waist", { y: 0, duration: 0.3, ease: "expo.out" }, 4.3);
      tl.to("#w-feet", { y: -500, duration: 0.25, ease: "power3.in" }, 4.05);

      // 4. Hero: slow push, then a hard punch-in on the half
      tl.set("#w-hero", { scale: 1.0 }, 0);
      tl.to("#w-hero", { scale: 1.06, duration: 1.1, ease: "none" }, 5.2);
      tl.set("#w-hero", { scale: 1.32, transformOrigin: "50% 30%" }, 6.3);
      tl.to("#w-hero", { scale: 1.38, duration: 0.9, ease: "none" }, 6.3);
      // dip cut out of the hero
      tl.to("#dip", { opacity: 0.45, duration: 0.1, ease: "none" }, 7.1);
      tl.set("#dip", { opacity: 0 }, 7.2);

      // 5. The turn: lands large, settles, then a jump-cut punch-in
      tl.set("#w-turn", { scale: 1.15 }, 0);
      tl.to("#w-turn", { scale: 1.0, duration: 0.6, ease: "expo.out" }, 7.2);
      tl.set("#w-turn2", { scale: 1.14, transformOrigin: "50% 35%" }, 0);
      tl.to("#w-turn2", { scale: 1.2, duration: 0.7, ease: "none" }, 7.9);

      // 6. Flurry: white flash frames on each cut, alternating punch scales
      [8.6, 8.85, 9.1, 9.35].forEach((t, i) => {
        tl.set("#flash", { opacity: i % 2 ? 0.35 : 0.6 }, t);
        tl.to("#flash", { opacity: 0, duration: 0.1, ease: "power2.out" }, t + 0.001);
      });
      tl.set("#w-f1", { scale: 1.2 }, 0);
      tl.set("#w-f2", { scale: 1.45, transformOrigin: "50% 30%" }, 0);
      tl.set("#w-f3", { scale: 1.15 }, 0);
      tl.set("#w-f4", { scale: 1.3 }, 0);
      // 9.6–9.8: black hold before the payoff

      // 7. Payoff: smile lands large and settles; cut to the extreme close-up; bars close to black
      tl.set("#w-smile", { scale: 1.2 }, 0);
      tl.to("#w-smile", { scale: 1.0, duration: 1.2, ease: "expo.out" }, 9.8);
      tl.set("#w-close", { scale: 1.08 }, 0);
      tl.to("#w-close", { scale: 1.0, duration: 2.0, ease: "power2.out" }, 11);
      tl.to(BARS, { scaleY: 0.94, duration: 0.9, ease: "power3.in" }, 12.0);
      tl.to(BARS, { scaleY: 1, duration: 0.12, ease: "none" }, 12.9);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
